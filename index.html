
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🧠 Azure Voice Bot</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    h1 { font-size: 28px; }
    #webchat { height: 500px; width: 100%; margin-top: 20px; }
  </style>
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
</head>
<body>
  <h1>👋 Голосовой бот регистрации</h1>
  <div id="webchat" role="main"></div>
  <script>
    const directLineToken = "YNaGtT09Dr7rKCGokVLz6MPpSwTfZSjrRCS6vEZsfP7mJQDl0UQwJQQJ99BEACYeBjFAArohAAABAZBSVgEW.6Per04LncoLY0jTmSGCVNcUfIUJ1jdOpaoFYdI4u6SCUrAh8475fJQQJ99BEACYeBjFAArohAAABAZBS40nV";
    const speechKey = "CPdoNcBdee0zA1B1l5BvT2tBtQQpUrzfqSashfQfu8vo4lekDivJJQQJ99BEAC5RqLJXJ3w3AAAYACOGsVxP";
    const speechRegion = "westeurope";

    (async function () {
      const speechServicesPonyfillFactory = await window.WebChat.createCognitiveServicesSpeechServicesPonyfillFactory({
        credentials: {
          region: speechRegion,
          subscriptionKey: speechKey
        }
      });

      window.WebChat.renderWebChat({
        directLine: window.WebChat.createDirectLine({ token: directLineToken }),
        webSpeechPonyfillFactory: speechServicesPonyfillFactory,
        userID: 'user_' + Date.now(),
        locale: 'en-US'
      }, document.getElementById('webchat'));
    })();
  </script>
</body>
</html>
