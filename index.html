
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Speech Registration Bot</title>
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
  <style>
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #webchat {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="webchat"></div>
  <script>
    const directLineSpeechAdapters = window.WebChat.createDirectLineSpeechAdapters({
      credentials: {
        region: 'westeurope',
        subscriptionKey: 'CPdoNcBdee0zA1B1l5BvT2tBtQQpUrzfqSashfQfu8vo4lekDivJJQQJ99BEAC5RqLJXJ3w3AAAYACOGsVxP'
      }
    });

    window.WebChat.renderWebChat(
      {
        directLine: directLineSpeechAdapters.directLine,
        webSpeechPonyfillFactory: directLineSpeechAdapters.webSpeechPonyfillFactory,
        userID: 'user-123',
        username: 'Student',
        locale: 'en-US'
      },
      document.getElementById('webchat')
    );
  </script>
</body>
</html>
